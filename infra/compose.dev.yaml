name: vermont-database

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vermont
      POSTGRES_USER: vermont
      POSTGRES_PASSWORD: vermont123!
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U people -d people"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data: